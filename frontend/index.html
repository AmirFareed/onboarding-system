<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FinTech - Onboarding Automation System, an AI-assisted financial document processing platform."
    />
    <title>FinTech | Onboarding Automation System</title>
    <script>
      (function () {
        var key = 'fintech-theme-preference';
        var preference = 'light';
        try {
          preference = window.localStorage.getItem(key) || 'light';
        } catch (e) {}
        var options = ['light', 'dark', 'black', 'mint', 'cherry'];
        if (options.indexOf(preference) === -1) {
          preference = 'light';
        }
        document.documentElement.setAttribute('data-theme', preference);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
