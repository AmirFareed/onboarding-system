[pytest]
# Mirrors backend/pytest.ini for invocations from the repo root. backend/pytest.ini's
# own testpaths=tests only takes effect when pytest's rootdir resolves to backend/
# (i.e. invoked from within backend/, or with backend/ passed explicitly) -- a bare
# `pytest` from the repo root never discovers that file at all (pytest stops
# searching upward for an ini file at the first one found starting from the
# invocation directory, and repo root has none until now), so it fell back to
# recursive collection from the repo root with no testpaths scoping. That silently
# swept up backend/scripts/*.py (matches the default test_*.py glob) -- disposable
# scratch scripts, not part of the test suite, which crash on import because they
# bypass backend/tests/conftest.py's environment setup entirely.
pythonpath = backend
testpaths = backend/tests
markers =
    integration: real-engine integration tests (run by default; skipped when PaddleOCR is unavailable)
