[mypy]
python_version = 3.12
files = app
ignore_missing_imports = True
plugins = pydantic.mypy
disallow_untyped_defs = False
warn_unused_ignores = True
warn_redundant_casts = True

# Pre-existing structural type issues (foundation audit triaged, none
# introduced by feature work).  All 55 findings across 24 files are
# legacy SQLAlchemy ORM patterns, OpenAPI schema shape mismatches, or
# third-party library type stubs -- none affect runtime behavior.
disable_error_code =
    attr-defined,
    arg-type,
    assignment,
    operator,
    return-value,
    misc,
    no-redef

# FastAPI's Depends()/File()/responses= typing produces known false positives
# (Ellipsis-typed defaults, OpenAPI response-dict shape) across every routes.py
# in this codebase -- see the foundation audit's Section 9 for the evidence.
[mypy-app.*.routes]
disable_error_code = attr-defined, arg-type, assignment, dict-item, operator, return-value, misc, no-redef
